name: Apply production hardening

on:
  push:
    branches:
      - agent/production-rbac-ui-hardening
    paths:
      - .github/workflows/apply-production-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-rbac-ui-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply scoped production hardening
        run: python ops/apply-production-hardening.py

      - name: Install and test frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Install and test backend security and RBAC
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate
          npm run build
          npm run test:rbac
          npm run test:security

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden production RBAC and UI foundations"
          git push origin HEAD:agent/production-rbac-ui-hardening
