name: Remediate backend dependency advisories

on:
  push:
    branches:
      - agent/production-readiness-rbac-hardening
    paths:
      - .github/workflows/fix-backend-audit.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-readiness-rbac-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply non-breaking npm audit fixes
        working-directory: backend
        run: |
          npm ci
          npm audit fix
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes were required"
          else
            git commit -m "fix(deps): remediate backend security advisories"
            git push origin HEAD:agent/production-readiness-rbac-hardening
          fi
