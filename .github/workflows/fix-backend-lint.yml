name: Remediate backend lint blocker

on:
  push:
    branches:
      - agent/production-readiness-rbac-hardening
    paths:
      - .github/workflows/fix-backend-lint.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-readiness-rbac-hardening
          fetch-depth: 0
      - name: Replace control-character regex with explicit sanitizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/modules/operations/recruitment-pdf.ts')
          text = path.read_text()
          old = "return String(value ?? '').replace(/[\\u0000-\\u001f\\u007f]/g, ' ').trim().slice(0, maximum);"
          new = "return [...String(value ?? '')].map((character) => { const code = character.charCodeAt(0); return code <= 31 || code === 127 ? ' ' : character; }).join('').trim().slice(0, maximum);"
          if old not in text:
              raise SystemExit('Expected sanitizer expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify and commit
        run: |
          cd backend
          npm ci
          npx eslint "{src,prisma}/**/*.ts"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/operations/recruitment-pdf.ts
          git diff --cached --check
          git commit -m "fix: sanitize recruitment PDF text without control regex"
          git push origin HEAD:agent/production-readiness-rbac-hardening
