name: Apply defense-in-depth RBAC hardening

on:
  push:
    branches:
      - agent/production-rbac-ui-hardening
    paths:
      - .github/workflows/import-production-rbac-defense.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-rbac-ui-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Import reviewed defense-in-depth changes
        shell: bash
        run: |
          git fetch origin agent/production-readiness-rbac-hardening
          git show origin/agent/production-readiness-rbac-hardening:backend/src/modules/attendance/attendance.service.ts > backend/src/modules/attendance/attendance.service.ts
          git show origin/agent/production-readiness-rbac-hardening:backend/src/modules/authorization/authorization.service.ts > backend/src/modules/authorization/authorization.service.ts
          mkdir -p backend/prisma/migrations/20260825000000_attendance_hr_privacy
          git show origin/agent/production-readiness-rbac-hardening:backend/prisma/migrations/20260825000000_attendance_hr_privacy/migration.sql > backend/prisma/migrations/20260825000000_attendance_hr_privacy/migration.sql
          git show origin/agent/production-readiness-rbac-hardening:backend/scripts/production-rbac-regression.js > backend/scripts/production-rbac-regression.js
          git show origin/agent/production-readiness-rbac-hardening:src/attendance-authorization.test.ts > src/attendance-authorization.test.ts
          python <<'PY'
          from pathlib import Path
          import json

          api = Path('src/api.ts')
          text = api.read_text(encoding='utf-8')
          old = 'listWhen<Record<string, unknown>>(hasAnyPermission(session, "attendance.self.read", "attendance.team.read", "attendance.management.read", "attendance.hr.read", "attendance.read_all"), "/attendance")'
          new = 'listWhen<Record<string, unknown>>(hasAnyPermission(session, "attendance.hr.read", "attendance.hr.manage", "attendance.audit.read", "attendance.read_all"), "/attendance")'
          if old not in text:
              raise SystemExit('attendance loader permission anchor not found')
          api.write_text(text.replace(old, new, 1), encoding='utf-8')

          package = Path('backend/package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          scripts = data['scripts']
          if 'test:production-rbac' not in scripts:
              ordered = {}
              for key, value in scripts.items():
                  ordered[key] = value
                  if key == 'test:rbac':
                      ordered['test:production-rbac'] = 'npm run build && node scripts/production-rbac-regression.js'
              data['scripts'] = ordered
          package.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify frontend authorization and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify backend authorization and security
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate
          npm run build
          npm run test:rbac
          npm run test:production-rbac
          npm run test:security

      - name: Commit verified defense-in-depth changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/attendance/attendance.service.ts \
                  backend/src/modules/authorization/authorization.service.ts \
                  backend/prisma/migrations/20260825000000_attendance_hr_privacy/migration.sql \
                  backend/scripts/production-rbac-regression.js \
                  backend/package.json src/api.ts src/attendance-authorization.test.ts
          git commit -m "fix: enforce attendance privacy and protected step-up defense in depth"
          git push origin HEAD:agent/production-rbac-ui-hardening
