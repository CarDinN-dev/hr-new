name: Add live attendance RBAC assertions

on:
  push:
    branches:
      - agent/production-readiness-rbac-hardening
    paths:
      - .github/workflows/add-attendance-rbac-integration.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-readiness-rbac-hardening
          fetch-depth: 0
      - name: Add real API authorization assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/scripts/integration-regression.js')
          text = path.read_text()
          anchor = "  const blocked = await login('rbac.blocked@example.invalid', blockedPassword);\n\n"
          addition = """  const blocked = await login('rbac.blocked@example.invalid', blockedPassword);

  for (const role of ['EMPLOYEE', 'LINE_MANAGER', 'MANAGER']) {
    assert.equal((await api('/attendance', {}, sessions[role])).status, 403, `${role} must not list attendance`);
    assert.equal((await api('/attendance/reports/summary', {}, sessions[role])).status, 403, `${role} must not read attendance reports`);
    assert.equal((await mutate('/attendance/check-in', sessions[role], {})).status, 403, `${role} must not check in through the HR attendance module`);
  }
  for (const role of ['HR', 'CPO', 'COO', 'ADMIN', 'SUPER_ADMIN']) {
    assert.equal((await api('/attendance', {}, sessions[role])).status, 200, `${role} must retain authorized attendance read access`);
    assert.equal((await api('/attendance/reports/summary', {}, sessions[role])).status, 200, `${role} must retain authorized attendance report access`);
  }

"""
          if anchor not in text:
              raise SystemExit('Integration insertion point not found')
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Commit integration coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/integration-regression.js
          git diff --cached --check
          git commit -m "test: verify attendance privacy through live API"
          git push origin HEAD:agent/production-readiness-rbac-hardening
