name: Update security regression for hardened authorization

on:
  push:
    branches:
      - agent/production-readiness-rbac-hardening
    paths:
      - .github/workflows/update-security-regression.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-readiness-rbac-hardening
          fetch-depth: 0
      - name: Update security regression fixtures
        run: python3 scripts/update-security-regression.py
      - name: Run security regression and commit
        run: |
          cd backend
          npm ci
          npm run test:security
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/security-regression.js
          git diff --cached --check
          git commit -m "test: require step-up and model recursive role graph"
          git push origin HEAD:agent/production-readiness-rbac-hardening
