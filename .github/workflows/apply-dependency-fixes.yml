name: Apply dependency security fixes

on:
  push:
    branches:
      - agent/production-rbac-ui-hardening
    paths:
      - .github/workflows/apply-dependency-fixes.yml

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-rbac-ui-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update and verify frontend dependencies
        run: |
          npm ci
          npm audit fix
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Update and verify backend dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit fix
          npm run prisma:generate
          npm run build
          npm run test:rbac
          npm run test:security
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package.json backend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: update vulnerable dependencies"
          git push origin HEAD:agent/production-rbac-ui-hardening
