name: Capture redesigned UI screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ui-screenshots.yml
      - src/**
      - backend/**
      - index.html
  push:
    branches: [agent/uiux-pro-max-redesign]
    paths: [.github/workflows/ui-screenshots.yml]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: screenshot-db-password
          POSTGRES_DB: hr_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hr_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:screenshot-db-password@127.0.0.1:5432/hr_erp?schema=public
      JWT_SECRET: screenshot_validation_jwt_secret_0123456789abcdefghijklmnopqrstuvwxyz_ABCDEFGHIJKLMNOPQRSTUVWXYZ
      AUDIT_HMAC_KEY: screenshot_validation_audit_key_0123456789abcdefghijklmnopqrstuvwxyz_ABCDEFGHIJKLMNOPQRSTUVWXYZ
      INITIAL_SUPER_ADMIN_EMAIL: screenshots@medtech.local
      INITIAL_SUPER_ADMIN_PASSWORD: Screenshot-Only-Admin-2026!
      SEED_TEST_PERSONAS: "false"
      PORT: "3100"
      CORS_ORIGIN: http://127.0.0.1:4173
      MICROSOFT_TENANT_ID: 11111111-1111-4111-8111-111111111111
      MICROSOFT_CLIENT_ID: 22222222-2222-4222-8222-222222222222
      MICROSOFT_CLIENT_SECRET: screenshot-client-secret-2026
      MICROSOFT_REDIRECT_URI: http://127.0.0.1:3100/api/v1/auth/microsoft/callback
      MICROSOFT_PROVISIONING_ENABLED: "false"
      DOCUMENT_SCAN_ENABLED: "false"
      VITE_API_URL: http://127.0.0.1:3100/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and start backend
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate
          npm run prisma:deploy
          npm run seed
          npm run build
          nohup npm run start:prod > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/v1/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1

      - name: Start frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/frontend.log
          exit 1

      - name: Capture every route
        run: |
          mkdir -p screenshots
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
            colorScheme: 'light',
            reducedMotion: 'reduce'
          });
          const page = await context.newPage();
          const base = 'http://127.0.0.1:4173';

          await page.goto(base, { waitUntil: 'networkidle' });
          await page.screenshot({ path: 'screenshots/00-login.png', fullPage: true });
          await page.getByLabel('Email').fill(process.env.INITIAL_SUPER_ADMIN_EMAIL);
          await page.getByLabel('Password').fill(process.env.INITIAL_SUPER_ADMIN_PASSWORD);
          await page.getByRole('button', { name: /^Sign in$/ }).click();
          await page.locator('.topbar').waitFor({ state: 'visible', timeout: 30000 });

          const routes = [
            ['01-dashboard', '/'], ['02-my-hr', '/me'], ['03-team', '/team'],
            ['04-employees', '/employees'], ['05-attendance', '/attendance'],
            ['06-leave', '/leave'], ['07-business-trips', '/business-trips'],
            ['08-expenses', '/expenses'], ['09-loans', '/loans'],
            ['10-payroll', '/payroll'], ['11-recruitment', '/recruitment'],
            ['12-eos', '/eos'], ['13-documents', '/documents'],
            ['14-reports', '/reports'], ['15-audit', '/audit'],
            ['16-system', '/system'], ['17-settings', '/settings']
          ];

          const manifest = [];
          for (const [name, route] of routes) {
            await page.goto(base + route, { waitUntil: 'networkidle' });
            await page.locator('.topbar').waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForTimeout(500);
            const heading = await page.locator('.page-title h1').textContent().catch(() => name);
            await page.screenshot({ path: `screenshots/${name}.png`, fullPage: true });
            manifest.push({ name, route, heading });
          }
          await fs.writeFile('screenshots/manifest.json', JSON.stringify(manifest, null, 2));
          await browser.close();
          EOF
          node /tmp/capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: medtech-hr-redesign-screenshots
          path: screenshots/
          retention-days: 7

      - name: Diagnostics
        if: failure()
        run: |
          cat /tmp/backend.log 2>/dev/null || true
          cat /tmp/frontend.log 2>/dev/null || true
