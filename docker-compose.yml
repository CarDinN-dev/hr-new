services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    init: true
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hr_erp
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [database]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  clamav:
    image: clamav/clamav:1.4_base@sha256:b6294770c55fcec0b082c45467b74945a532ec6a34aa8f0facdddd4c196734be
    init: true
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    mem_reservation: 768m
    cpus: 2
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    networks: [scanner]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 6m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${DEPLOYED_COMMIT:-unknown}
    image: ${API_IMAGE:-medtech-hr-erp-api:latest}
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    pids_limit: 256
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/hr_erp?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?set AUDIT_HMAC_KEY in .env}
      AUDIT_HMAC_KEY_ID: ${AUDIT_HMAC_KEY_ID:-legacy}
      AUDIT_HMAC_PREVIOUS_KEYS: ${AUDIT_HMAC_PREVIOUS_KEYS:-{}}
      JWT_EXPIRES_IN: 8h
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:?set MICROSOFT_TENANT_ID in .env}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:?set MICROSOFT_CLIENT_ID in .env}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:?set MICROSOFT_CLIENT_SECRET in .env}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:?set MICROSOFT_REDIRECT_URI in .env}
      MICROSOFT_PROVISIONING_ENABLED: ${MICROSOFT_PROVISIONING_ENABLED:-false}
      MICROSOFT_PROVISIONING_TENANT_ID: ${MICROSOFT_PROVISIONING_TENANT_ID:-}
      MICROSOFT_PROVISIONING_CLIENT_ID: ${MICROSOFT_PROVISIONING_CLIENT_ID:-}
      MICROSOFT_PROVISIONING_CLIENT_SECRET: ${MICROSOFT_PROVISIONING_CLIENT_SECRET:-}
      MICROSOFT_ENTERPRISE_APP_OBJECT_ID: ${MICROSOFT_ENTERPRISE_APP_OBJECT_ID:-}
      MICROSOFT_USER_APP_ROLE_ID: ${MICROSOFT_USER_APP_ROLE_ID:-}
      GCS_DOCUMENTS_BUCKET: ${GCS_DOCUMENTS_BUCKET:-}
      DOCUMENT_SCAN_ENABLED: ${DOCUMENT_SCAN_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      LEAVE_EMAIL_ENABLED: ${LEAVE_EMAIL_ENABLED:-false}
      ANNOUNCEMENT_EMAIL_ENABLED: ${ANNOUNCEMENT_EMAIL_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [edge, database, scanner]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  hr-erp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        BUILD_COMMIT: ${DEPLOYED_COMMIT:-unknown}
    image: ${WEB_IMAGE:-medtech-hr-erp:latest}
    user: "101:101"
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,size=8m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    pids_limit: 128
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  clamav_data:

networks:
  edge:
  database:
    internal: true
  scanner:
