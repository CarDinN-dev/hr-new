services:
  postgres:
    ports: !override []
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgresql-tls/server.crt
      - -c
      - ssl_key_file=/run/postgresql-tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ${POSTGRES_TLS_DIR:-/var/lib/medtech-hr-erp/postgres-tls}:/run/postgresql-tls:ro
      - ./ops/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
  api:
    command: ["node", "dist/main.js"]
    environment:
      DATABASE_URL: postgresql://hr_erp_app:${DATABASE_APP_PASSWORD:?set DATABASE_APP_PASSWORD}@postgres:5432/hr_erp?schema=public&sslmode=require&sslcert=postgres-ca.crt&sslaccept=strict
    volumes:
      - ${POSTGRES_TLS_DIR:-/var/lib/medtech-hr-erp/postgres-tls}/ca.crt:/app/prisma/postgres-ca.crt:ro
  hr-erp:
    ports: !override
      - "127.0.0.1:8080:8080"
