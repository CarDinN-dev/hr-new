# Unix-socket administration remains local to the PostgreSQL container.
local   all             all                                     trust
# Application and migration traffic must use TLS and SCRAM.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
